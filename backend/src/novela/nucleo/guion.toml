rol = "verificador_de_continuidad"

[[criba.mayores]]
dimension = "anacronismo_conceptual"
rol = "verificador_de_continuidad"

[[criba.mayores]]
dimension = "anacronismo_social_e_institucional"
rol = "verificador_de_continuidad"

[[criba.mayores]]
dimension = "cambio_de_valor"
rol = "verificador_de_continuidad"

[[criba.pulido]]
dimension = "ritmo"
rol = "verificador_de_continuidad"

[[criba.pulido]]
dimension = "anacronismo_lexico"
rol = "editor_de_estilo"

[[criba.pulido]]
dimension = "fatiga_lexica"
rol = "editor_de_estilo"

[[criba.pulido]]
dimension = "tics_de_modelo"
rol = "editor_de_estilo"

[[criba.pulido]]
dimension = "coherencia_de_voz"
rol = "juez_de_rubrica"

[[criba.global]]
dimension = "progresion_de_arcos"
rol = "arquitecto_de_arcos"

[[criba.global]]
dimension = "economia_narrativa"
rol = "arquitecto_de_arcos"

[[criba.global]]
dimension = "curva_de_tension"
rol = "arquitecto_de_arcos"

[[criba.global]]
dimension = "distribucion_de_revelaciones"
rol = "arquitecto_de_arcos"

[[criba.global]]
dimension = "fidelidad_historica"
rol = "arquitecto_de_arcos"

[[criba.global]]
dimension = "cobertura_documental"
rol = "arquitecto_de_arcos"

[[criba.global]]
dimension = "obra_cerrada_sin_defectos_abiertos"
rol = "arquitecto_de_arcos"
