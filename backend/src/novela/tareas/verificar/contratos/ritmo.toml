# Contrato de verificacion de `ritmo`.
#
# Tres partes y ninguna mas: el predicado en una frase, la proyeccion minima
# sobre la que se evalua y la forma exacta de la `Critica` si falla. Lo que
# sobra en la proyeccion es lo que produce falsos positivos.

dimension = "ritmo"
rol = "verificador_de_continuidad"
metodo_de_verificacion = "analisis"
alcance = "escena"
criba = "pulido"

predicado = "La proporcion de parrafos por modo cae dentro de la banda objetivo declarada para el capitulo."
proyeccion_minima = ["texto_producido", "plan_del_capitulo"]

[critica]
severidad = "menor"
evidencia_aceptada = "El recuento por modo y la banda declarada con la que no cuadra."
