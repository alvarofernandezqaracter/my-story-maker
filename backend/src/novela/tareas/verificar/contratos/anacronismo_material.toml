# Contrato de verificacion de `anacronismo_material`.
#
# Tres partes y ninguna mas: el predicado en una frase, la proyeccion minima
# sobre la que se evalua y la forma exacta de la `Critica` si falla. Lo que
# sobra en la proyeccion es lo que produce falsos positivos.

dimension = "anacronismo_material"
rol = "verificador_de_continuidad"
metodo_de_verificacion = "inspeccion"
alcance = "local"
criba = "mayores"

predicado = "Todo objeto mencionado tiene disponibilidad temporal compatible con la fecha de la escena."
proyeccion_minima = ["contrato_de_escena", "canon", "texto_producido"]

[critica]
severidad = "mayor"
evidencia_aceptada = "El objeto nombrado y su disponibilidad temporal en la ficha."
