# Contrato de verificacion de `continuidad_de_estado`.
#
# Tres partes y ninguna mas: el predicado en una frase, la proyeccion minima
# sobre la que se evalua y la forma exacta de la `Critica` si falla. Lo que
# sobra en la proyeccion es lo que produce falsos positivos.

dimension = "continuidad_de_estado"
rol = "verificador_de_continuidad"
metodo_de_verificacion = "analisis"
alcance = "escena"
criba = "bloqueantes"

predicado = "Presencias, posesiones y ubicaciones del texto son compatibles con el estado derivado."
proyeccion_minima = ["estado_en_n_menos_1", "texto_producido"]

[critica]
severidad = "bloqueante"
evidencia_aceptada = "El hecho que el texto afirma y el del estado con el que choca."
