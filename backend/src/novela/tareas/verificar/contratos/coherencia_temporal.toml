# Contrato de verificacion de `coherencia_temporal`.
#
# Tres partes y ninguna mas: el predicado en una frase, la proyeccion minima
# sobre la que se evalua y la forma exacta de la `Critica` si falla. Lo que
# sobra en la proyeccion es lo que produce falsos positivos.

dimension = "coherencia_temporal"
rol = "verificador_de_continuidad"
metodo_de_verificacion = "analisis"
alcance = "escena"
criba = "bloqueantes"

predicado = "Los desplazamientos son posibles con las fechas y los lugares ya escritos, comparando valores, no calculandolos."
proyeccion_minima = ["contrato_de_escena", "estado_en_n_menos_1", "texto_producido"]

[critica]
severidad = "bloqueante"
evidencia_aceptada = "Las dos fechas o los dos lugares escritos que no cuadran entre si."
