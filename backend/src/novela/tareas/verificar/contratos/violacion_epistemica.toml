# Contrato de verificacion de `violacion_epistemica`.
#
# Tres partes y ninguna mas: el predicado en una frase, la proyeccion minima
# sobre la que se evalua y la forma exacta de la `Critica` si falla. Lo que
# sobra en la proyeccion es lo que produce falsos positivos.

dimension = "violacion_epistemica"
rol = "verificador_de_continuidad"
metodo_de_verificacion = "analisis"
alcance = "escena"
criba = "bloqueantes"

predicado = "Ningun personaje actua sobre una proposicion que todavia no sabe en ese instante."
proyeccion_minima = ["estado_en_n_menos_1", "voces_del_elenco", "texto_producido"]

[critica]
severidad = "bloqueante"
evidencia_aceptada = "La replica o accion, y el hecho del estado que dice que aun no lo sabia."
