# Contrato de verificacion de `anacronismo_conceptual`.
#
# Tres partes y ninguna mas: el predicado en una frase, la proyeccion minima
# sobre la que se evalua y la forma exacta de la `Critica` si falla. Lo que
# sobra en la proyeccion es lo que produce falsos positivos.

dimension = "anacronismo_conceptual"
rol = "verificador_de_continuidad"
metodo_de_verificacion = "inspeccion"
alcance = "local"
criba = "mayores"

predicado = "Ningun concepto invocado queda fuera de su disponibilidad de epoca y de ambito."
proyeccion_minima = ["canon", "texto_producido"]

[critica]
severidad = "mayor"
evidencia_aceptada = "El fragmento que invoca el concepto y la ficha que lo situa fuera de epoca."
