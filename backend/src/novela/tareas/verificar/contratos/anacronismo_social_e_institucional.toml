# Contrato de verificacion de `anacronismo_social_e_institucional`.
#
# Tres partes y ninguna mas: el predicado en una frase, la proyeccion minima
# sobre la que se evalua y la forma exacta de la `Critica` si falla. Lo que
# sobra en la proyeccion es lo que produce falsos positivos.

dimension = "anacronismo_social_e_institucional"
rol = "verificador_de_continuidad"
metodo_de_verificacion = "inspeccion"
alcance = "local"
criba = "mayores"

predicado = "Practicas y cargos del texto son coherentes con los vigentes en el marco."
proyeccion_minima = ["canon", "texto_producido"]

[critica]
severidad = "mayor"
evidencia_aceptada = "La practica o el cargo nombrado y la ficha que lo contradice."
