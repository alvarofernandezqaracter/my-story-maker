# Contrato de verificacion de `curva_de_tension`.
#
# Tres partes y ninguna mas: el predicado en una frase, la proyeccion minima
# sobre la que se evalua y la forma exacta de la `Critica` si falla. Lo que
# sobra en la proyeccion es lo que produce falsos positivos.

dimension = "curva_de_tension"
rol = "arquitecto_de_arcos"
metodo_de_verificacion = "analisis"
alcance = "obra"
criba = "global"

predicado = "Las escenas de escalada y giro se reparten sin dejar mesetas largas."
proyeccion_minima = ["funcion_estructural_de_las_escenas"]

[critica]
severidad = "menor"
evidencia_aceptada = "El tramo de escenas seguidas sin escalada ni giro."
