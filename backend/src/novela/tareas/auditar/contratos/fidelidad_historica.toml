# Contrato de verificacion de `fidelidad_historica`.
#
# Tres partes y ninguna mas: el predicado en una frase, la proyeccion minima
# sobre la que se evalua y la forma exacta de la `Critica` si falla. Lo que
# sobra en la proyeccion es lo que produce falsos positivos.

dimension = "fidelidad_historica"
rol = "arquitecto_de_arcos"
metodo_de_verificacion = "analisis"
alcance = "obra"
criba = "global"

predicado = "Todo elemento marcado `licencia` tiene su justificacion registrada."
proyeccion_minima = ["canon", "decisiones"]

[critica]
severidad = "mayor"
evidencia_aceptada = "El elemento con licencia y la ausencia de su justificacion."
