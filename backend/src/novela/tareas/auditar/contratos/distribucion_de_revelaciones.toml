# Contrato de verificacion de `distribucion_de_revelaciones`.
#
# Tres partes y ninguna mas: el predicado en una frase, la proyeccion minima
# sobre la que se evalua y la forma exacta de la `Critica` si falla. Lo que
# sobra en la proyeccion es lo que produce falsos positivos.

dimension = "distribucion_de_revelaciones"
rol = "arquitecto_de_arcos"
metodo_de_verificacion = "analisis"
alcance = "obra"
criba = "global"

predicado = "Los cambios epistemicos del lector estan espaciados y no se amontonan."
proyeccion_minima = ["log_de_estado"]

[critica]
severidad = "menor"
evidencia_aceptada = "Los eventos `aprende` o `revela_a` amontonados, con su capitulo."
