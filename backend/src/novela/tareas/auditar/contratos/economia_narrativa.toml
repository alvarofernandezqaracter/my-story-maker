# Contrato de verificacion de `economia_narrativa`.
#
# Tres partes y ninguna mas: el predicado en una frase, la proyeccion minima
# sobre la que se evalua y la forma exacta de la `Critica` si falla. Lo que
# sobra en la proyeccion es lo que produce falsos positivos.

dimension = "economia_narrativa"
rol = "arquitecto_de_arcos"
metodo_de_verificacion = "analisis"
alcance = "obra"
criba = "global"

predicado = "Ningun compromiso queda abierto al cierre, y ningun pago carece de su setup previo."
proyeccion_minima = ["cola_de_compromisos"]

[critica]
severidad = "bloqueante"
evidencia_aceptada = "El compromiso concreto, con el capitulo en que se planto."
