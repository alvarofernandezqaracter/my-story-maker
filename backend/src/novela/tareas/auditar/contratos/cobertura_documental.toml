# Contrato de verificacion de `cobertura_documental`.
#
# Tres partes y ninguna mas: el predicado en una frase, la proyeccion minima
# sobre la que se evalua y la forma exacta de la `Critica` si falla. Lo que
# sobra en la proyeccion es lo que produce falsos positivos.

dimension = "cobertura_documental"
rol = "arquitecto_de_arcos"
metodo_de_verificacion = "analisis"
alcance = "obra"
criba = "global"

predicado = "Cada afirmacion historica del capitulo tiene una `Fuente` asociada."
proyeccion_minima = ["texto_aceptado_del_capitulo", "fuentes_recogidas"]

[critica]
severidad = "mayor"
evidencia_aceptada = "La afirmacion sin fuente, citada literal."
