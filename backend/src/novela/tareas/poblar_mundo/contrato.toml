# Contrato de la tarea `poblar_mundo`.
#
# Un rol, una tarea: declarar un rol es anadir una carpeta con todo lo suyo
# dentro. Lo que este contrato declara es lo que el backend impone, no lo que
# el prompt pide.

tarea = "poblar_mundo"
rol = "constructor_de_mundo"
alcance = "obra"
cuando = "Al arrancar la obra y cuando haga falta ampliar el elenco"

# Sin ninguna herramienta salvo las que aqui se conceden.
herramientas = []

# Que ve y que no ve (architecture.md 3).
entrada = ["obra_y_premisa", "elenco_declarado", "fuentes_recogidas"]
no_ve = ["el plan", "la prosa", "el estado en N"]

# Que deja escrito. Lo que no este aqui, el backend no se lo deja escribir.
escribe = ["Personaje", "Lugar", "Objeto", "Faccion", "Decision"]

# Que rechaza de lo que recibe: campos obligatorios del artefacto de entrada.
[rechaza]
obra_y_premisa = ["titulo", "epoca", "premisa"]
