# Contrato de verificacion de `tics_de_modelo`.
#
# Tres partes y ninguna mas: el predicado en una frase, la proyeccion minima
# sobre la que se evalua y la forma exacta de la `Critica` si falla. Lo que
# sobra en la proyeccion es lo que produce falsos positivos.

dimension = "tics_de_modelo"
rol = "editor_de_estilo"
metodo_de_verificacion = "inspeccion"
alcance = "local"
criba = "pulido"

predicado = "El texto no contiene ninguno de los patrones recurrentes de superficie declarados."
proyeccion_minima = ["texto_producido", "registro_linguistico"]

[critica]
severidad = "sugerencia"
evidencia_aceptada = "El patron y el fragmento donde aparece."
