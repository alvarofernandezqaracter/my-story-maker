# Contrato de la tarea `destilar`.
#
# Un rol, una tarea: declarar un rol es anadir una carpeta con todo lo suyo
# dentro. Lo que este contrato declara es lo que el backend impone, no lo que
# el prompt pide.

tarea = "destilar"
rol = "archivero"
alcance = "capitulo"
cuando = "Al cerrar capitulo, despues del Contable"

# Sin ninguna herramienta salvo las que aqui se conceden.
herramientas = []

# Que ve y que no ve (architecture.md 3).
entrada = ["texto_aceptado_del_capitulo", "cola_de_compromisos", "registro_acumulado_de_estilo", "indice_de_la_biblia"]
no_ve = ["el canon", "el estado en N"]

# Que deja escrito. Lo que no este aqui, el backend no se lo deja escribir.
escribe = ["ResumenCapitulo", "Mencion", "Decision"]

# Una `Mencion` por hecho de la biblia que el capitulo nombra, con el `id` que
# trae el indice de la biblia (RF-80, RF-81). El indice no es el canon: lleva
# id, tipo, nombre y licencia de cada ficha y ningun atributo mas.

# Que rechaza de lo que recibe: campos obligatorios del artefacto de entrada.
[rechaza]
texto_aceptado_del_capitulo = ["texto"]
