[project]
name = "novela"
version = "0.1.2"
description = "Generador de novelas historicas por agentes: del brief del editor al manuscrito verificado"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "sqlite-vec>=0.1.6",
    "fastembed>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.7",
    "mypy>=1.13",
    "import-linter>=2",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/novela"]

[tool.fastapi]
entrypoint = "novela.api.principal:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q -m 'not gasta'"
markers = [
    "lento: tarda lo suyo; se ejecuta en periodo, no en cada commit",
    "gasta: invoca agentes reales y por tanto cuesta dinero",
]

[tool.ruff]
line-length = 96
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
files = ["src/novela/api"]
python_version = "3.13"
strict = true

# Bibliotecas de terceros sin tipos publicados. El unico sitio con tipos
# declarados es el borde HTTP, y estas no llegan hasta ahi.
[[tool.mypy.overrides]]
module = ["sqlite_vec.*", "fastembed.*"]
ignore_missing_imports = true
