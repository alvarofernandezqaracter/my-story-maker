              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      summary: Rehacer
      description: 'Rehacer desde un capitulo: la version anterior se conserva entera
        y la

        nueva reescribe de ese capitulo al final (RF-111). No espera a que termine.'
      operationId: rehacer_obras__id_obra__versiones_post
