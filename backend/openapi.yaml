          description: Identificador de la obra
          title: Id Obra
        description: Identificador de la obra
      responses:
        '200':
          description: Flujo abierto mientras la obra corre. Cada evento `progreso`
            lleva un `Progreso`; el evento `terminada` lo cierra.
          content:
