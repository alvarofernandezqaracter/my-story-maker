      operationId: ver_hechos_obras__id_obra__hechos_get
      parameters:
      - name: id_obra
        in: path
        required: true
        schema:
          type: string
          description: Identificador de la obra
          title: Id Obra
        description: Identificador de la obra
      - name: tipo
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - Personaje
            - Lugar
            - Objeto
            - Faccion
            - Evento
            type: string
          - type: 'null'
          title: Tipo
      - name: licencia
        in: query
        required: false
