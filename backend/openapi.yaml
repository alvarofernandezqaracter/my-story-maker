components:
  schemas:
    BorradorDeBrief:
      properties:
        titulo:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Titulo
        epoca:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Epoca
        premisa:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Premisa
        tesis_tematica:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Tesis Tematica
        elenco_declarado:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Elenco Declarado
        capitulos_objetivo:
          anyOf:
          - type: integer
            maximum: 200.0
            minimum: 1.0
          - type: 'null'
          title: Capitulos Objetivo
        politicas_globales:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Politicas Globales
        arcos:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Arcos
        destinatario:
          anyOf:
          - $ref: '#/components/schemas/BorradorDeDestinatario'
          - type: 'null'
      type: object
      title: BorradorDeBrief
      description: El brief a medio escribir. Tiene los campos del `Brief`, todos
        opcionales.
    BorradorDeDestinatario:
      properties:
        nombre:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Nombre
        edad:
          anyOf:
          - type: integer
            maximum: 130.0
            minimum: 0.0
          - type: 'null'
          title: Edad
        tono:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Tono
        dedicatoria:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Dedicatoria
        rasgos:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Rasgos
        recuerdos:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Recuerdos
        vetos:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Vetos
      type: object
      title: BorradorDeDestinatario
      description: 'El destinatario tal como la persona lo lleva escrito: todo opcional.


        Un campo ausente es un campo por preguntar. Una lista presente, aunque venga

        vacia, es lo que la persona escribio, y ninguna pasada le quita nada (RF-73).'
    Brief:
      properties:
        titulo:
          type: string
          minLength: 1
          title: Titulo
          description: Titulo de la obra
        epoca:
          type: string
          minLength: 1
          title: Epoca
          description: Epoca y ambito geografico
        premisa:
          type: string
          minLength: 1
          title: Premisa
          description: De que va
        tesis_tematica:
          type: string
          minLength: 1
          title: Tesis Tematica
          description: Que sostiene la obra
        elenco_declarado:
