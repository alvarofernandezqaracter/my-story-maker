          title: Id Obra
        description: Identificador de la obra
      - name: numero
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          title: Numero
      - name: version
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          description: Version que se lee. Sin ella, la publicada, y si no hay, la
            ultima
          title: Version
        description: Version que se lee. Sin ella, la publicada, y si no hay, la ultima
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapituloInspeccionado'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /obras/{id_obra}/criticas:
