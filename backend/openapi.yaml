  /obras/{id_obra}/cronologia:
    get:
      summary: Ver Cronologia
      description: Sucesos en orden, con momento, lugar y presentes con su nacimiento.
      operationId: ver_cronologia_obras__id_obra__cronologia_get
      parameters:
