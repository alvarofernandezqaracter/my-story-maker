# Contrato de la frontera entre backend/ y frontend/ (SPEC1 RI-10, D-11).
# Generado desde los modelos del borde; no se edita a mano. Lo vuelca la
# prueba tests/test_contrato_de_frontera.py cuando el borde cambia.
openapi: 3.1.0
info:
  title: Generador de novela historica por agentes
  summary: Lanza una obra desde un brief e inspecciona lo que los agentes producen
  version: 0.4.0
paths:
  /obras:
    post:
      summary: Lanzar Obra
      operationId: lanzar_obra_obras_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Brief'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObraCreada'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /entrevistas:
    post:
      summary: Abrir Entrevista
      description: 'Abre una entrevista y hace su primera pasada. Si el brief queda

        completo y sin contradicciones abiertas, la obra se lanza sola (RF-78).'
      operationId: abrir_entrevista_entrevistas_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeticionDeEntrevista'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasadaDeEntrevista'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /entrevistas/{id_entrevista}/pasadas:
    post:
      summary: Pasar Entrevista
      description: La pasada siguiente. No recibe nada de las anteriores (D-20).
      operationId: pasar_entrevista_entrevistas__id_entrevista__pasadas_post
      parameters:
      - name: id_entrevista
        in: path
        required: true
        schema:
          type: string
          description: Identificador de la entrevista
          title: Id Entrevista
        description: Identificador de la entrevista
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeticionDeEntrevista'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasadaDeEntrevista'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /obras/{id_obra}:
    get:
      summary: Ver Obra
      operationId: ver_obra_obras__id_obra__get
      parameters:
      - name: id_obra
        in: path
        required: true
        schema:
          type: string
          description: Identificador de la obra
          title: Id Obra
        description: Identificador de la obra
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FichaDeObra'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /obras/{id_obra}/manuscrito:
    get:
      summary: Leer Manuscrito
      description: 'Solo el texto aceptado, en orden, con los capitulos marcados,
        de la

        version pedida o de la de referencia.'
      operationId: leer_manuscrito_obras__id_obra__manuscrito_get
      parameters:
      - name: id_obra
        in: path
        required: true
        schema:
          type: string
          description: Identificador de la obra
          title: Id Obra
        description: Identificador de la obra
      - name: version
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          description: Version que se lee. Sin ella, la publicada, y si no hay, la
            ultima
          title: Version
        description: Version que se lee. Sin ella, la publicada, y si no hay, la ultima
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Manuscrito'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /obras/{id_obra}/capitulos/{numero}:
