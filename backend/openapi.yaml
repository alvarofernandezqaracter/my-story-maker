        required: true
        schema:
          type: string
          description: Identificador de la obra
          title: Id Obra
        description: Identificador de la obra
      - name: estado
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Estado
      - name: dimension
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Dimension
      - name: severidad
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Severidad
      - name: capitulo
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          title: Capitulo
      - name: version
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          description: Version que se lee. Sin ella, la publicada, y si no hay, la
            ultima
          title: Version
        description: Version que se lee. Sin ella, la publicada, y si no hay, la ultima
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
