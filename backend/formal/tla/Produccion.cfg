\* El modelo pequeno que TLC recorre entero (SPEC1 RF-160): tres capitulos,
\* dos versiones -la segunda puede ser un rehacer desde N o un cambio del
\* lector-, dos intentos por paso como en guion.toml, un hecho de la biblia,
\* una caida del proceso, un reanudar del editor y un fallo no previsto del
\* caminante. Lo recorre en unos dos minutos.
SPECIFICATION Spec
CONSTANTS
    C = 3
    MaxV = 2
    R = 2
    Hechos = {h1}
    MaxCaidas = 1
    MaxReanudar = 1
    MaxFallos = 1
INVARIANTS
    TypeOK
    PuertaRespetada
    AnteriorIntacta
    UnaSolaProduccion
    NiDuplica
PROPERTIES
    NiPierde
    NoEscribeEnTerminada
    AcabaTerminadaODetenida
CHECK_DEADLOCK FALSE
