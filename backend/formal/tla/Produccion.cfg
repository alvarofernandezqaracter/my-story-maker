\* Modelo pequeno que TLC recorre entero (SPEC1 RF-160).
\* Tres capitulos, hasta tres versiones, dos intentos por paso como en
\* guion.toml, un hecho de la biblia, una caida, dos reanudar y un fallo
\* no previsto del caminante.
SPECIFICATION Spec
CONSTANTS
    C = 3
    MaxV = 3
    R = 2
    Hechos = {h1}
    MaxCaidas = 1
    MaxReanudar = 2
    MaxFallos = 1
INVARIANTS
    TypeOK
    PuertaRespetada
    AnteriorIntacta
    UnaSolaProduccion
    NiDuplica
PROPERTIES
    NiPierde
    AcabaTerminadaODetenida
CHECK_DEADLOCK FALSE
