[project]
name = "my-story-maker"
version = "1.30.0"
description = "Sistema multiagente de novelas historicas orquestado por Claude Code"
requires-python = ">=3.11"

# La novela la escribe una sesion de Claude Code (§21), no este paquete. Lo que
# hay aqui es lo que rodea a esa conversacion: leer el canon en ficheros, servir
# la interfaz y trazar. Nada de eso necesita instalar dependencias; todo sale de
# la biblioteca estandar.
dependencies = []

[project.optional-dependencies]
# Las trazas de §20 no son obligatorias: sin este paquete todo corre igual y la
# capa de trazas se queda muda. Ningun fallo de observabilidad para una novela.
trazas = ["langfuse>=4.15,<5"]

[project.scripts]
novela = "novela.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["novela"]
