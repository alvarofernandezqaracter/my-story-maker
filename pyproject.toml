[project]
name = "my-story-maker"
version = "0.14.0"
description = "Sistema multiagente de novelas historicas"
requires-python = ">=3.11"

# El modo simulado, que es el de por defecto, no necesita instalar nada: todo
# sale de la biblioteca estandar (sqlite3, unittest, pathlib). Las dos unicas
# dependencias son opcionales: el SDK oficial en modo real (§12) y el de
# Langfuse si se quieren trazas (§20). Sin ninguna de las dos, el repo recien
# clonado escribe una novela entera.
dependencies = []

[project.optional-dependencies]
real = ["anthropic>=1.6,<2"]
# Las trazas de §20 tampoco son obligatorias: sin este paquete el harness corre
# igual y la capa de trazas se queda muda.
trazas = ["langfuse>=4.15,<5"]

[project.scripts]
novela = "novela.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["novela"]
